pulse.properties = {
    server.address = [ "unix:native" ]
    pulse.min.req = 256/48000
    pulse.default.req = 512/48000
    pulse.default.tlength = 1920/48000
    pulse.min.frag = 256/48000
    pulse.default.frag = 512/48000
    pulse.min.quantum = 256/48000
    pulse.default.format = F32
    pulse.cmd.always-sink = false
}
pulse.properties.rules = [
    { matches = [ { cpu.vm.name = !null } ]
      actions = { update-props = { pulse.min.quantum = 256/48000 } } }
]
# Level meters observe existing capture; they must not start every physical
# microphone or implicitly activate Bluetooth communication mode.
"pulse.rules" = [
    { matches = [ { application.id = "org.PulseAudio.pavucontrol" }
                  { application.name = "PulseAudio Volume Control" } ]
      actions = { update-props = { node.passive = true } } }
]
stream.rules = [
    { matches = [ { stream.monitor = true resample.peaks = true } ]
      actions = { update-props = { node.passive = true } } }
]
